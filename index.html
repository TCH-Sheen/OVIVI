<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sorting Game: Safe Multi-Touch Edition</title>
    <!-- Load Tracking Assets Safely with Deferral -->
    <script src="https://jsdelivr.net" crossorigin="anonymous" defer></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous" defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; background-color: #f0f4f8; overflow: hidden; text-align: center;
            user-select: none; -webkit-user-select: none;
        }
        h1 { margin: 15px 0; color: #2c3e50; font-size: 26px; }
        #game-container { position: relative; width: 100vw; height: 80vh; display: flex; justify-content: space-between; }
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; display: block; }
        #canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .column {
            position: relative; width: 32%; height: 90%; margin: 20px;
            background-color: rgba(255, 255, 255, 0.45); border: 4px dashed #2c3e50; border-radius: 15px;
            z-index: 3; display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(4px);
        }
        .column h2 { background-color: #2c3e50; color: white; padding: 10px 20px; border-radius: 10px; margin-top: 15px; font-size: 22px; }
        .animal-card {
            position: absolute; width: 150px; height: 150px; background-color: #ffffff; border: 4px solid #34495e;
            border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; z-index: 10; box-shadow: 0 8px 16px rgba(0,0,0,0.25);
            left: calc(50% - 75px); top: calc(50% - 75px); cursor: grab; touch-action: none;
        }
        .animal-card:active { cursor: grabbing; }
        .animal-icon-box {
            width: 100%; height: 95px; display: flex; align-items: center; justify-content: center;
            background: #f7f9fa; border-top-left-radius: 16px; border-top-right-radius: 16px; pointer-events: none;
        }
        .animal-svg-graphics { width: 70px; height: 70px; }
        .animal-label { height: 45px; display: flex; align-items: center; justify-content: center; color: #2c3e50; background: #ffffff; width: 100%; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; pointer-events: none; }
        #status-message {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95); color: white; padding: 12px 35px; border-radius: 25px;
            font-size: 18px; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>🥚 Animal Sorting: Oviparous vs Viviparous 🐾</h1>
    
    <div id="game-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas-overlay"></canvas>

        <div class="column" id="oviparous-zone"><h2>OVIPAROUS (Eggs)</h2></div>
        <div class="column" id="viviparous-zone"><h2>VIVIPAROUS (Live)</h2></div>

        <div id="animal" class="animal-card">
            <div class="animal-icon-box" id="graphic-holder"></div>
            <div class="animal-label" id="label">Loading...</div>
        </div>
    </div>

    <div id="status-message">Ready! Drag with your Mouse / Touch or wait for Hand Tracker setup...</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas-overlay');
        const canvasCtx = canvasElement.getContext('2d');
        const animalCard = document.getElementById('animal');
        const statusText = document.getElementById('status-message');
        const graphicHolder = document.getElementById('graphic-holder');

        const pool = [
            { name: 'Chicken', type: 'oviparous', svg: '<svg class="animal-svg-graphics" viewBox="0 0 24 24" fill="#d35400"><path d="M12,2A3,3 0 0,1 15,5V6H17A2,2 0 0,1 19,8V10C19,13.79 15.93,16.86 12.14,16.97L12,17C7.58,17 4,13.42 4,9C4,7.42 4.46,5.95 5.24,4.71L5.3,4.62L12,2M12,18A1,1 0 0,1 13,19V22H11V19A1,1 0 0,1 12,18M7.5,9A1.5,1.5 0 1,0 6,7.5A1.5,1.5 0 0,0 7.5,9Z"/></svg>' },
            { name: 'Dog', type: 'viviparous', svg: '<svg class="animal-svg-graphics" viewBox="0 0 24 24" fill="#e67e22"><path d="M10,21A1,1 0 0,1 9,22H7A1,1 0 0,1 6,21V18H4A2,2 0 0,1 2,16V9A5,5 0 0,1 7,4H9A1,1 0 0,1 10,5V7H14V5A1,1 0 0,1 15,4H17A5,5 0 0,1 22,9V16A2,2 0 0,1 20,18H18V21A1,1 0 0,1 17,22H15A1,1 0 0,1 14,21V18H10V21M7,7A1,1 0 1,0 6,6A1,1 0 0,0 7,7M17,7A1,1 0 1,0 16,6A1,1 0 0,0 17,7Z"/></svg>' },
            { name: 'Frog', type: 'oviparous', svg: '<svg class="animal-svg-graphics" viewBox="0 0 24 24" fill="#27ae60"><path d="M12,2A4,4 0 0,1 16,6C16,7.5 15.17,8.81 13.94,9.5C16.82,10.22 19,12.85 19,16V18A2,2 0 0,1 17,20H7A2,2 0 0,1 5,18V16C5,12.85 7.18,10.22 10.06,9.5C8.83,8.81 8,7.5 8,6A4,4 0 0,1 12,2M9.5,6A1,1 0 1,0 10.5,7A1,1 0 0,0 9.5,6M14.5,6A1,1 0 1,0 15.5,7A1,1 0 0,0 14.5,6Z"/></svg>' },
            { name: 'Cat', type: 'viviparous', svg: '<svg class="animal-svg-graphics" viewBox="0 0 24 24" fill="#7f8c8d"><path d="M12,9A5,5 0 0,1 17,14V20A2,2 0 0,1 15,22H9A2,2 0 0,1 7,20V14A5,5 0 0,1 12,9M6,2L9,6H3L6,2M18,2L21,6H15L18,2Z"/></svg>' },
            { name: 'Turtle', type: 'oviparous', svg: '<svg class="animal-svg-graphics" viewBox="0 0 24 24" fill="#16a085"><path d="M12,2A3,3 0 0,1 15,5V6.1C18.3,7.2 20.8,9.9 21.7,13.3L22,14.5A2,2 0 0,1 20,16.5H4A2,2 0 0,1 2,14.5L2.3,13.3C3.2,9.9 5.7,7.2 9,6.1V5A3,3 0 0,1 12,2Z"/></svg>' },
            { name: 'Lion', type: 'viviparous', svg: '<svg class="animal-svg-graphics" viewBox="0 0 24 24" fill="#d35400"><path d="M12,2C6.48,2 2,6.48 2,12C2,17.52 6.48,22 12,22C17.52,22 22,17.52 22,12C22,6.48 17.52,2 12,2M12,6A4,4 0 0,1 16,10C16,12.21 14.21,14 12,14A4,4 0 0,1 8,10C8,7.79 9.79,6 12,6Z"/></svg>' }
        ];

        pool.sort(() => Math.random() - 0.5);
        let currentIdx = 0;
        let isHolding = false;

        function resetCardPosition() {
            animalCard.style.left = "calc(50% - 75px)";
            animalCard.style.top = "calc(50% - 75px)";
            isHolding = false;
        }

        function displayCurrentItem() {
            const currentItem = pool[currentIdx];
            graphicHolder.innerHTML = currentItem.svg;
            document.getElementById('label').innerText = currentItem.name;
            resetCardPosition();
        }
        displayCurrentItem();

        function spawnNext() {
            currentIdx = (currentIdx + 1) % pool.length;
            displayCurrentItem();
            statusText.innerText = "Drag the " + pool[currentIdx].name + " into its category!";
        }

        // --- 1. CORE FAIL-SAFE: IMMEDIATE MOUSE & TOUCH INTERACTION UNLOCK ---
        let isDragging = false;
        let startX = 0, startY = 0;

        function grabCard(e) {
            isDragging = true;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startX = clientX - animalCard.offsetLeft;
            startY = clientY - animalCard.offsetTop;
        }

        function moveCard(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (!clientX || !clientY) return;

            animalCard.style.left = (clientX - startX) + 'px';
            animalCard.style.top = (clientY - startY) + 'px';
        }

        function releaseCard(e) {
            if (!isDragging) return;
            isDragging = false;

            const rect = animalCard.getBoundingClientRect();
            const midX = rect.left + (rect.width / 2);
            const screenWidth = window.innerWidth;
            const currentItem = pool[currentIdx];

            if (midX < screenWidth * 0.35) { // Left Drop Area
                if (currentItem.type === 'oviparous') {
                    statusText.innerText = "✨ Correct! " + currentItem.name + " lays eggs!";
                    setTimeout(spawnNext, 1200);
                } else {
                    statusText.innerText = "❌ Try again! " + currentItem.name + " gives live birth.";
                    resetCardPosition();
                }
            } else if (midX > screenWidth * 0.65) { // Right Drop Area
                if (currentItem.type === 'viviparous') {
                    statusText.innerText = "✨ Correct! " + currentItem.name + " gives live birth!";
                    setTimeout(spawnNext, 1200);
                } else {
                    statusText.innerText = "❌ Try again! " + currentItem.name + " lays eggs.";
                    resetCardPosition();
                }
            } else {
                resetCardPosition();
            }
        }

        animalCard.addEventListener('mousedown', grabCard);
        window.addEventListener('mousemove', moveCard);
        window.addEventListener('mouseup', releaseCard);

        animalCard.addEventListener('touchstart', grabCard, { passive: true });
        window.addEventListener('touchmove', moveCard, { passive: true });
        window.addEventListener('touchend', releaseCard);


        // --- 2. WEBCAM FEED ACTIVATION ENGINE ---
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
            .then(stream => { videoElement.srcObject = stream; })
            .catch(err => { console.log("Webcam background stream blocked or missing: ", err); });
