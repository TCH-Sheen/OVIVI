<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sorting Game: Oviparous vs Viviparous</title>
    
    <!-- Updated Stable MediaPipe Tracking Links (Ensures network bypass) -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            overflow: hidden;
            text-align: center;
        }
        h1 { margin: 10px 0; color: #2c3e50; }
        #game-container {
            position: relative;
            width: 100vw;
            height: 85vh;
            display: flex;
            justify-content: space-between;
        }
        /* Hidden backup preview box to confirm camera hardware works */
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
            background-color: #d1d8e0;
        }
        #canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .column {
            position: relative;
            width: 32%;
            height: 90%;
            margin: 20px;
            background-color: rgba(255, 255, 255, 0.4);
            border: 4px dashed #2c3e50;
            border-radius: 15px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .column h2 {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 24px;
        }
        .animal-card {
            position: absolute;
            width: 120px;
            height: 120px;
            background-color: #ffda79;
            border: 3px solid #ccae62;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            z-index: 4;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .animal-emoji { font-size: 40px; margin-bottom: 5px; }
        #status-message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            color: white;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 18px;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>🥚 Animal Sorting: Oviparous vs Viviparous 🐾</h1>
    
    <div id="game-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas-overlay"></canvas>

        <div class="column" id="oviparous-zone">
            <h2>OVIPAROUS (Egg)</h2>
        </div>

        <div class="column" id="viviparous-zone">
            <h2>VIVIPAROUS (Live)</h2>
        </div>

        <div id="animal" class="animal-card" style="top: 40%; left: 45%;">
            <div class="animal-emoji" id="emoji">🐔</div>
            <div id="label">Chicken</div>
        </div>
    </div>

    <div id="status-message">Initializing game camera tracking engines... Please stay still.</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas-overlay');
        const canvasCtx = canvasElement.getContext('2d');
        const animalCard = document.getElementById('animal');
        const statusText = document.getElementById('status-message');

        const pool = [
            { name: 'Chicken', emoji: '🐔', type: 'oviparous' },
            { name: 'Dog', emoji: '🐶', type: 'viviparous' },
            { name: 'Frog', emoji: '🐸', type: 'oviparous' },
            { name: 'Cat', emoji: '🐱', type: 'viviparous' },
            { name: 'Turtle', emoji: '🐢', type: 'oviparous' },
            { name: 'Lion', emoji: '🦁', type: 'viviparous' }
        ];
        let currentItem = pool[0];
        let isHolding = false;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnNext() {
            const currentIdx = pool.indexOf(currentItem);
            const nextIdx = (currentIdx + 1) % pool.length;
            currentItem = pool[nextIdx];
            document.getElementById('emoji').innerText = currentItem.emoji;
            document.getElementById('label').innerText = currentItem.name;
            animalCard.style.top = "40%";
            animalCard.style.left = "45%";
            isHolding = false;
        }

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const thumb = hand[4];
                const indexIdx = hand[8];

                const handX = (1 - indexIdx.x) * window.innerWidth;
                const handY = indexIdx.y * window.innerHeight;

                canvasCtx.beginPath();
                canvasCtx.arc(handX, handY, 15, 0, 2 * Math.PI);
                canvasCtx.fillStyle = isHolding ? '#2ecc71' : '#e74c3c';
                canvasCtx.fill();

                const distance = Math.hypot(indexIdx.x - thumb.x, indexIdx.y - thumb.y);
                const isPinching = distance < 0.06;

                const cardRect = animalCard.getBoundingClientRect();
                const overCard = (
                    handX >= cardRect.left && handX <= cardRect.right &&
                    handY >= cardRect.top && handY <= cardRect.bottom
                );

                if (isPinching && (overCard || isHolding)) {
                    isHolding = true;
                    animalCard.style.left = (handX - 60) + 'px';
                    animalCard.style.top = (handY - 60) + 'px';
                    statusText.innerText = "Dragging: " + currentItem.name;
                } else if (!isPinching && isHolding) {
                    const finalX = handX;
                    const widthBound = window.innerWidth;

                    if (finalX < widthBound * 0.35) {
                        if (currentItem.type === 'oviparous') {
                            statusText.innerText = "✨ Correct! " + currentItem.name + " lays eggs.";
                            setTimeout(spawnNext, 1500);
                        } else {
                            statusText.innerText = "❌ Try again! " + currentItem.name + " gives live birth.";
                            animalCard.style.top = "40%"; animalCard.style.left = "45%";
                            isHolding = false;
                        }
                    } else if (finalX > widthBound * 0.65) {
                        if (currentItem.type === 'viviparous') {
                            statusText.innerText = "✨ Correct! " + currentItem.name + " gives live birth.";
                            setTimeout(spawnNext, 1500);
                        } else {
                            statusText.innerText = "❌ Try again! " + currentItem.name + " lays eggs.";
                            animalCard.style.top = "40%"; animalCard.style.left = "45%";
                            isHolding = false;
                        }
                    } else {
                        isHolding = false;
                        statusText.innerText = "Pinch your fingers over the animal to GRAB it!";
                    }
                }
            }
        }

        // Direct Browser Media Stream Fallback Connection (Forces camera access before tracking begins)
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
        .then((stream) => {
            videoElement.srcObject = stream;
            statusText.innerText = "Camera linked! Setting up hand gesture sensors...";
            
            // Start the Hand gesture framework safely
            const hands = new Hands({
                locateFile: (file) => `https://jsdelivr.net{file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });
            hands.onResults(onResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1280,
                height: 720
            });
            camera.start().then(() => {
                statusText.innerText = "✨ Setup complete! Pinch your index and thumb over the animal to grab it.";
            });
        })
        .catch((err) => {
            statusText.innerText = "🚨 Hardware Blocked: Please ensure no other apps (like Zoom or Teams) are using your camera.";
            console.error(err);
