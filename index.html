<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sorting Game: Oviparous vs Viviparous</title>
    <!-- Load MediaPipe Hand Tracking Libraries -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            overflow: hidden;
            text-align: center;
        }
        h1 { margin: 10px 0; color: #2c3e50; }
        #game-container {
            position: relative;
            width: 100vw;
            height: 85vh;
            display: flex;
            justify-content: space-between;
        }
        /* Webcam view styling */
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror camera for easier interaction */
            z-index: 1;
        }
        #canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        /* Game columns setup */
        .column {
            position: relative;
            width: 30%;
            height: 90%;
            margin: 20px;
            background-color: rgba(255, 255, 255, 0.15);
            border: 4px dashed rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            backdrop-filter: blur(4px);
        }
        .column h2 {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 24px;
        }
        /* Draggable Animal Card */
        .animal-card {
            position: absolute;
            width: 120px;
            height: 120px;
            background-color: #ffda79;
            border: 3px solid #ccae62;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            z-index: 4;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .animal-emoji { font-size: 40px; margin-bottom: 5px; }
        #status-message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 18px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <h1>🥚 Animal Sorting: Oviparous vs Viviparous 🐾</h1>
    
    <div id="game-container">
        <!-- Background camera and tracking canvas -->
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas-overlay"></canvas>

        <!-- Left Sorting Column -->
        <div class="column" id="oviparous-zone">
            <h2>OVIPAROUS (Egg)</h2>
        </div>

        <!-- Right Sorting Column -->
        <div class="column" id="viviparous-zone">
            <h2>VIVIPAROUS (Live)</h2>
        </div>

        <!-- Target Animal to grab -->
        <div id="animal" class="animal-card" style="top: 40%; left: 45%;">
            <div class="animal-emoji" id="emoji">🐔</div>
            <div id="label">Chicken</div>
        </div>
    </div>

    <div id="status-message">Pinch your index finger and thumb over the animal to GRAB it!</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas-overlay');
        const canvasCtx = canvasElement.getContext('2d');
        const animalCard = document.getElementById('animal');
        const statusText = document.getElementById('status-message');

        // Sample list of animals with answers
        const pool = [
            { name: 'Chicken', emoji: '🐔', type: 'oviparous' },
            { name: 'Dog', emoji: '🐶', type: 'viviparous' },
            { name: 'Frog', emoji: '🐸', type: 'oviparous' },
            { name: 'Cat', emoji: '🐱', type: 'viviparous' },
            { name: 'Turtle', emoji: '🐢', type: 'oviparous' },
            { name: 'Lion', emoji: '🦁', type: 'viviparous' }
        ];
        let currentItem = pool[0];
        let isHolding = false;

        // Resize overlay coordinates dynamically
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnNext() {
            const currentIdx = pool.indexOf(currentItem);
            const nextIdx = (currentIdx + 1) % pool.length;
            currentItem = pool[nextIdx];
            document.getElementById('emoji').innerText = currentItem.emoji;
            document.getElementById('label').innerText = currentItem.name;
            animalCard.style.top = "40%";
            animalCard.style.left = "45%";
            isHolding = false;
        }

        // Handle MediaPipe hand results loop
        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                
                // Get tip coordinates of Thumb (4) and Index finger (8)
                const thumb = hand[4];
                const indexIdx = hand[8];

                // Convert tracking metrics to absolute screen pixels (Mirrored horizontally)
                const handX = (1 - indexIdx.x) * window.innerWidth;
                const handY = indexIdx.y * window.innerHeight;

                // Draw a visual target cursor over the student's index finger tip
                canvasCtx.beginPath();
                canvasCtx.arc(handX, handY, 15, 0, 2 * Math.PI);
                canvasCtx.fillStyle = isHolding ? '#2ecc71' : '#e74c3c';
                canvasCtx.fill();

                // Compute pinch distance between thumb and index finger
                const distance = Math.hypot(indexIdx.x - thumb.x, indexIdx.y - thumb.y);
                const isPinching = distance < 0.05;

                // Check card dimensions
                const cardRect = animalCard.getBoundingClientRect();
                const overCard = (
                    handX >= cardRect.left && handX <= cardRect.right &&
                    handY >= cardRect.top && handY <= cardRect.bottom
                );

                if (isPinching && (overCard || isHolding)) {
                    isHolding = true;
                    // Center card exactly under hand cursor
                    animalCard.style.left = (handX - 60) + 'px';
                    animalCard.style.top = (handY - 60) + 'px';
                    statusText.innerText = "Dragging: " + currentItem.name;
                } else if (!isPinching && isHolding) {
                    // Item dropped! Evaluate position against category zones
                    const finalX = handX;
                    const widthBound = window.innerWidth;

                    if (finalX < widthBound * 0.35) { // Left column drop
                        if (currentItem.type === 'oviparous') {
                            statusText.innerText = "✨ Correct! " + currentItem.name + " lays eggs.";
                            setTimeout(spawnNext, 1500);
                        } else {
                            statusText.innerText = "❌ Try again! " + currentItem.name + " gives live birth.";
                            animalCard.style.top = "40%"; animalCard.style.left = "45%";
                            isHolding = false;
                        }
                    } else if (finalX > widthBound * 0.65) { // Right column drop
                        if (currentItem.type === 'viviparous') {
                            statusText.innerText = "✨ Correct! " + currentItem.name + " gives live birth.";
                            setTimeout(spawnNext, 1500);
                        } else {
                            statusText.innerText = "❌ Try again! " + currentItem.name + " lays eggs.";
                            animalCard.style.top = "40%"; animalCard.style.left = "45%";
                            isHolding = false;
                        }
                    } else {
                        isHolding = false;
                        statusText.innerText = "Dropped in middle. Drop it fully into a designated column box!";
                    }
                }
            }
        }

        // Initialize MediaPipe Framework
        const hands = new Hands({
            locateFile: (file) => `https://jsdelivr.net{file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        // Access the User's Video Webcam Stream
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
