<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sorting Game: Oviparous vs Viviparous</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            overflow: hidden;
            text-align: center;
            user-select: none;
        }
        h1 { margin: 15px 0; color: #2c3e50; }
        #game-container {
            position: relative;
            width: 100vw;
            height: 80vh;
            display: flex;
            justify-content: space-between;
        }
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
            background-color: #e2e8f0;
        }
        .column {
            position: relative;
            width: 32%;
            height: 90%;
            margin: 20px;
            background-color: rgba(255, 255, 255, 0.4);
            border: 4px dashed #2c3e50;
            border-radius: 15px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            transition: background-color 0.3s;
        }
        .column h2 {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 24px;
        }
        .animal-card {
            position: absolute;
            width: 130px;
            height: 130px;
            background-color: #ffda79;
            border: 4px solid #ccae62;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            z-index: 10;
            cursor: grab;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            touch-action: none;
        }
        .animal-card:active { cursor: grabbing; }
        .animal-emoji { font-size: 45px; margin-bottom: 5px; }
        #status-message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            color: white;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 18px;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>🥚 Animal Sorting: Oviparous vs Viviparous 🐾</h1>
    
    <div id="game-container">
        <video id="webcam" autoplay playsinline></video>

        <div class="column" id="oviparous-zone">
            <h2>OVIPAROUS (Egg)</h2>
        </div>

        <div class="column" id="viviparous-zone">
            <h2>VIVIPAROUS (Live)</h2>
        </div>

        <div id="animal" class="animal-card">
            <div class="animal-emoji" id="emoji">🐔</div>
            <div id="label">Chicken</div>
        </div>
    </div>

    <div id="status-message">Loading classroom activity setup...</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const animalCard = document.getElementById('animal');
        const statusText = document.getElementById('status-message');

        const pool = [
            { name: 'Chicken', emoji: '🐔', type: 'oviparous' },
            { name: 'Dog', emoji: '🐶', type: 'viviparous' },
            { name: 'Frog', emoji: '🐸', type: 'oviparous' },
            { name: 'Cat', emoji: '🐱', type: 'viviparous' },
            { name: 'Turtle', emoji: '🐢', type: 'oviparous' },
            { name: 'Lion', emoji: '🦁', type: 'viviparous' }
        ];
        let currentIdx = 0;

        function resetCardPosition() {
            animalCard.style.left = "calc(50% - 65px)";
            animalCard.style.top = "calc(50% - 65px)";
        }
        resetCardPosition();

        function spawnNext() {
            currentIdx = (currentIdx + 1) % pool.length;
            const item = pool[currentIdx];
            document.getElementById('emoji').innerText = item.emoji;
            document.getElementById('label').innerText = item.name;
            resetCardPosition();
            statusText.innerText = "Drag the " + item.name + " to the correct home category!";
        }

        // Direct Webcam Fallback Engine
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
            .then(stream => {
                videoElement.srcObject = stream;
                statusText.innerText = "Camera Active! Use your mouse, touch, or hold your hand to sort!";
            })
            .catch(err => {
                console.log("Webcam blocked or missing: ", err);
                statusText.innerText = "School filter active: Webcam offline. Use your mouse or touchscreen to drag & drop!";
            });

        // Fail-Safe Interaction Framework (Mouse & Touch Tracking)
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        function startDrag(e) {
            isDragging = true;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const rect = animalCard.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
        }

        function doDrag(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (!clientX || !clientY) return;

            let targetX = clientX - offsetX;
            let targetY = clientY - offsetY;

            animalCard.style.left = targetX + "px";
            animalCard.style.top = targetY + "px";
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;

            const rect = animalCard.getBoundingClientRect();
            const cardMidX = rect.left + (rect.width / 2);
            const screenWidth = window.innerWidth;
            const currentItem = pool[currentIdx];

            if (cardMidX < screenWidth * 0.35) { // Left column check
                if (currentItem.type === 'oviparous') {
                    statusText.innerText = "✨ Awesome! " + currentItem.name + " lays eggs! Next item loading...";
                    setTimeout(spawnNext, 1800);
                } else {
                    statusText.innerText = "❌ Try again! " + currentItem.name + " gives live birth.";
                    resetCardPosition();
                }
            } else if (cardMidX > screenWidth * 0.65) { // Right column check
                if (currentItem.type === 'viviparous') {
                    statusText.innerText = "✨ Correct! " + currentItem.name + " gives live birth! Next item loading...";
                    setTimeout(spawnNext, 1800);
                } else {
                    statusText.innerText = "❌ Try again! " + currentItem.name + " lays eggs.";
                    resetCardPosition();
                }
            } else {
                resetCardPosition();
                statusText.innerText = "Drop the card entirely inside a column box layout!";
            }
        }

        animalCard.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', endDrag);

        animalCard.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('touchmove', doDrag, { passive: false });
        window.addEventListener('touchend', endDrag);
    </script>
</body>
</html>
