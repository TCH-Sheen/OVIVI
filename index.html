<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Sorting Game: Real Photos Hand Gesture Edition</title>
    <!-- Stable MediaPipe Script Delivery Matrix -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; background-color: #eef2f7; overflow: hidden; text-align: center;
        }
        h1 { margin: 10px 0; color: #2c3e50; font-size: 26px; }
        #game-container { position: relative; width: 100vw; height: 82vh; display: flex; justify-content: space-between; }
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; }
        #canvas-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        .column {
            position: relative; width: 31%; height: 92%; margin: 15px;
            background-color: rgba(255, 255, 255, 0.25); border: 4px dashed #2c3e50; border-radius: 20px;
            z-index: 3; display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(6px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .column h2 { background-color: #2c3e50; color: white; padding: 12px 24px; border-radius: 12px; margin-top: 20px; font-size: 22px; letter-spacing: 1px; }
        .animal-card {
            position: absolute; width: 160px; height: 160px; background-color: white; border: 4px solid #34495e;
            border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            font-weight: bold; font-size: 18px; z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            overflow: hidden; transition: transform 0.1s;
        }
        .animal-img { width: 100%; height: 115px; object-fit: cover; border-bottom: 3px solid #34495e; }
        .animal-label { height: 45px; display: flex; align-items: center; justify-content: center; color: #2c3e50; background: #fff; width: 100%; }
        #status-message {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95); color: white; padding: 14px 40px; border-radius: 30px;
            font-size: 18px; z-index: 20; box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <h1>🦅 Animal Sorting Game: Oviparous vs Viviparous 🐅</h1>
    
    <div id="game-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas-overlay"></canvas>

        <div class="column" id="oviparous-zone"><h2>OVIPAROUS (Eggs)</h2></div>
        <div class="column" id="viviparous-zone"><h2>VIVIPAROUS (Live Birth)</h2></div>

        <div id="animal" class="animal-card">
            <img class="animal-img" id="photo" src="" alt="Animal Image">
            <div class="animal-label" id="label">Loading...</div>
        </div>
    </div>

    <div id="status-message">Initializing hand gesture AI tracking matrix...</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas-overlay');
        const canvasCtx = canvasElement.getContext('2d');
        const animalCard = document.getElementById('animal');
        const statusText = document.getElementById('status-message');

        // Comprehensive Array of 17 Real Animals using Unsplash Real Photography Streams
        const pool = [
            { name: 'Chicken', img: 'https://unsplash.com', type: 'oviparous' },
            { name: 'Dog', img: 'https://unsplash.com', type: 'viviparous' },
            { name: 'Frog', img: 'https://unsplash.com', type: 'oviparous' },
            { name: 'Cat', img: 'https://unsplash.com', type: 'viviparous' },
            { name: 'Turtle', img: 'https://unsplash.com', type: 'oviparous' },
            { name: 'Lion', img: 'https://unsplash.com', type: 'viviparous' },
            { name: 'Duck', img: 'https://unsplash.com', type: 'oviparous' },
            { name: 'Elephant', img: 'https://unsplash.com', type: 'viviparous' },
            { name: 'Eagle', img: 'https://unsplash.com', type: 'oviparous' },
            { name: 'Cow', img: 'https://unsplash.com', type: 'viviparous' },
            { name: 'Snake', img: 'https://unsplash.com', type: 'oviparous' },
            { name: 'Whale', img: 'https://unsplash.com', type: 'viviparous' },
            { name: 'Crocodile', img: 'https://unsplash.com', type: 'oviparous' },
            { name: 'Kangaroo', img: 'https://unsplash.com', type: 'viviparous' },
            { name: 'Penguin', img: 'https://unsplash.com', type: 'oviparous' },
            { name: 'Monkey', img: 'https://unsplash.com', type: 'viviparous' },
            { name: 'Butterfly', img: 'https://unsplash.com', type: 'oviparous' }
        ];

        // Shuffle the animal deck to randomize student play order
        pool.sort(() => Math.random() - 0.5);
        let currentIdx = 0;
        let isHolding = false;

        function resetCardPosition() {
            animalCard.style.left = "calc(50% - 80px)";
            animalCard.style.top = "calc(50% - 80px)";
            isHolding = false;
        }

        function initDisplay() {
            const currentItem = pool[currentIdx];
            document.getElementById('photo').src = currentItem.img;
            document.getElementById('label').innerText = currentItem.name;
            resetCardPosition();
        }
        initDisplay();

        function spawnNext() {
            currentIdx = (currentIdx + 1) % pool.length;
            initDisplay();
            statusText.innerText = "Target set: Pinch index finger & thumb together to grab the " + pool[currentIdx].name + "!";
        }

        function onResults(results) {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const thumb = hand[4];
                const indexIdx = hand[8];

                // Map coordinates cleanly to standard monitor pixel scaling (mirrored orientation)
                const handX = (1 - indexIdx.x) * window.innerWidth;
                const handY = indexIdx.y * window.innerHeight;

                // Visual target point drawn over hand tip element
                canvasCtx.beginPath();
                canvasCtx.arc(handX, handY, 16, 0, 2 * Math.PI);
                canvasCtx.fillStyle = isHolding ? '#2ecc71' : '#e74c3c';
                canvasCtx.fill();
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = '#ffffff';
                canvasCtx.stroke();

                const distance = Math.hypot(indexIdx.x - thumb.x, indexIdx.y - thumb.y);
                const isPinching = distance < 0.055;

                const rect = animalCard.getBoundingClientRect();
                const overCard = (handX >= rect.left && handX <= rect.right && handY >= rect.top && handY <= rect.bottom);

                if (isPinching && (overCard || isHolding)) {
                    isHolding = true;
                    animalCard.style.left = (handX - 80) + 'px';
                    animalCard.style.top = (handY - 80) + 'px';
                    statusText.innerText = "Dragging: " + pool[currentIdx].name;
                } else if (!isPinching && isHolding) {
                    const cardMidX = handX;
                    const screenWidth = window.innerWidth;
                    const currentItem = pool[currentIdx];

                    if (cardMidX < screenWidth * 0.35) { // Drop Left Box Check
                        if (currentItem.type === 'oviparous') {
                            statusText.innerText = "✨ Correct! " + currentItem.name + " lays eggs! Next card incoming...";
                            setTimeout(spawnNext, 1600);
                        } else {
                            statusText.innerText = "❌ Incorrect! " + currentItem.name + " gives live birth (Viviparous).";
                            resetCardPosition();
                        }
                    } else if (cardMidX > screenWidth * 0.65) { // Drop Right Box Check
                        if (currentItem.type === 'viviparous') {
